<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">

  <!-- Holding Rod -->
  <rect x="80" y="80" width="4" height="80" rx="1" fill="#291e1a" />
  <circle cx="82" cy="88" r="3" fill="#291e1a" />

  <!-- Key Silhouette (Old-Fashioned Skeleton Key) -->
  <g fill="#291e1a">
    <!-- Bow (Ornamental Top Ring) -->
    <path d="M80 14 C62 14, 48 28, 48 46 C48 64, 62 78, 80 78 C98 78, 112 64, 112 46 C112 28, 98 14, 80 14 Z M80 24 C92 24, 102 34, 102 46 C102 58, 92 68, 80 68 C68 68, 58 58, 58 46 C58 34, 68 24, 80 24 Z" />

    <!-- Stem / Shaft -->
    <rect x="75" y="74" width="10" height="62" rx="1" />

    <!-- Bit (Key Tooth Cut-Outs) -->
    <path d="M85 110 H108 V132 H85 V124 H98 V118 H85 Z" />
  </g>

  <!-- Cut-out Detail Holes (Four-Leaf Clover / Trefoil Bow Cut-outs) -->
  <circle cx="80" cy="34" r="5" fill="#d4d3d1" />
  <circle cx="68" cy="46" r="5" fill="#d4d3d1" />
  <circle cx="92" cy="46" r="5" fill="#d4d3d1" />
  <circle cx="80" cy="58" r="5" fill="#d4d3d1" />

  <!-- Shaft Collar Rings Cut-out Lines -->
  <line x1="75" y1="82" x2="85" y2="82" stroke="#d4d3d1" stroke-width="2" />
  <line x1="75" y1="88" x2="85" y2="88" stroke="#d4d3d1" stroke-width="2" />
</svg>