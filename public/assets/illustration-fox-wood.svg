<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Aged Paper Page Background -->
  <rect width="400" height="300" fill="#d4d3d1" />

  <!-- Night Sky Backdrop Vignette -->
  <rect x="20" y="20" width="360" height="260" rx="4" fill="#291e1a" />

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#d4d3d1" opacity="0.8" />
  <circle cx="100" cy="60" r="1" fill="#d4d3d1" opacity="0.6" />
  <circle cx="180" cy="35" r="1.5" fill="#d4d3d1" opacity="0.9" />
  <circle cx="280" cy="50" r="1" fill="#d4d3d1" opacity="0.7" />
  <circle cx="340" cy="38" r="1.5" fill="#d4d3d1" opacity="0.8" />

  <!-- Background Pine Trees (Layer 1 - Deep Forest Distance) -->
  <path d="M40 180 L60 120 L80 180 Z M65 160 L85 100 L105 160 Z M130 170 L150 110 L170 170 Z M270 165 L290 95 L310 165 Z M320 175 L340 115 L360 175 Z" fill="#31542f" />

  <!-- Midground Pine Trees (Layer 2 - Dark Olive Cut-Paper) -->
  <!-- Tree 1 Left -->
  <path d="M20 220 L55 110 L90 220 Z" fill="#393e26" />
  <path d="M35 150 L55 110 L75 150 Z" fill="#d4d3d1" opacity="0.4" /> <!-- Snow on branches -->

  <!-- Tree 2 Center-Left -->
  <path d="M100 210 L135 90 L170 210 Z" fill="#393e26" />
  <path d="M118 135 L135 90 L152 135 Z" fill="#d4d3d1" opacity="0.4" />

  <!-- Tree 3 Center-Right -->
  <path d="M220 215 L255 100 L290 215 Z" fill="#393e26" />
  <path d="M238 140 L255 100 L272 140 Z" fill="#d4d3d1" opacity="0.4" />

  <!-- Tree 4 Right -->
  <path d="M300 230 L340 105 L380 230 Z" fill="#393e26" />
  <path d="M322 145 L340 105 L358 145 Z" fill="#d4d3d1" opacity="0.4" />

  <!-- Continuous Snowy Forest Ground (NO Water, NO Bridge) -->
  <path d="M20 200 Q100 185 200 205 T380 195 V280 H20 Z" fill="#291e1a" opacity="0.5" />
  <path d="M20 210 Q110 195 210 215 T380 205 V280 H20 Z" fill="#d4d3d1" />

  <!-- Soft Snow Drifts Layering -->
  <path d="M20 235 Q130 220 240 240 T380 230 V280 H20 Z" fill="#7687ab" opacity="0.25" />
  <path d="M20 245 Q100 238 180 250 T380 240 V280 H20 Z" fill="#d4d3d1" />

  <!-- Lantern Warm Light Glow in Snowy Wood -->
  <circle cx="250" cy="210" r="60" fill="#d9a443" opacity="0.2" />
  <circle cx="250" cy="210" r="32" fill="#d9a443" opacity="0.35" />

  <!-- Fox Carrying Lit Lantern (Identical Fox Pose, In Snowy Pine Wood) -->
  <g transform="translate(170, 165)">
    <!-- Fox Shadow on Snow -->
    <ellipse cx="60" cy="64" rx="35" ry="6" fill="#291e1a" opacity="0.35" />

    <!-- Bushy Tail -->
    <path d="M15 42 C-5 35, -15 20, -10 10 C0 15, 15 25, 25 35 Z" fill="#c95937" />
    <path d="M-10 10 C-5 12, 5 20, 10 25 Z" fill="#d4d3d1" />

    <!-- Fox Body -->
    <path d="M18 38 C25 28, 45 28, 65 32 C75 34, 82 25, 88 18 C92 24, 88 34, 78 42 C68 46, 35 48, 18 38 Z" fill="#c95937" />
    <path d="M55 36 C68 36, 78 40, 85 45 L74 46 Z" fill="#d4d3d1" /> <!-- Chest fur -->

    <!-- Head & Mouth Holding Lantern Handle -->
    <path d="M82 22 L98 20 L94 28 L84 28 Z" fill="#c95937" />
    <path d="M88 20 L80 12 L84 22 Z" fill="#5a3428" /> <!-- Ear -->

    <!-- Legs Walking in Deep Snow -->
    <path d="M28 44 L22 62 H28 L34 46 Z" fill="#291e1a" />
    <path d="M38 45 L44 62 H50 L42 45 Z" fill="#c95937" />
    <path d="M62 44 L56 62 H62 L68 45 Z" fill="#291e1a" />
    <path d="M72 43 L78 62 H84 L78 43 Z" fill="#c95937" />

    <!-- LIT LANTERN (Handle in Mouth) -->
    <!-- Metal Handle Wire -->
    <path d="M96 24 C100 24, 104 28, 104 36" fill="none" stroke="#291e1a" stroke-width="1.5" />
    <!-- Lantern Housing -->
    <rect x="98" y="36" width="12" height="18" rx="1" fill="#291e1a" />
    <rect x="100" y="38" width="8" height="14" fill="#d9a443" />
    <rect x="102" y="40" width="4" height="10" fill="#d4d3d1" />
  </g>

  <!-- Foreground Pine Branches Framing View -->
  <path d="M330 20 H380 V118 L358 58 Z" fill="#31542f" />
  <path d="M346 24 L380 48 V60 Z" fill="#d4d3d1" opacity="0.5" />
</svg>