<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340">
  <!-- Drop Shadow -->
  <rect x="26" y="24" width="188" height="288" rx="4" fill="#291e1a" opacity="0.22" />

  <!-- Sturdy Library-Style Binding Cover -->
  <rect x="20" y="18" width="188" height="288" rx="4" fill="#893f43" />

  <!-- Reinforced Library Spine (Dark Leather/Fabric Buckram Corner & Spine) -->
  <path d="M20 18 h36 v288 h-36 a4 4 0 0 1 -4 -4 v-280 a4 4 0 0 1 4 -4 z" fill="#5a3428" />
  <rect x="56" y="18" width="3" height="288" fill="#291e1a" opacity="0.25" />

  <!-- Library Corner Reinforcements -->
  <path d="M178 18 L208 18 V48 Z" fill="#5a3428" />
  <path d="M208 276 L208 306 H178 Z" fill="#5a3428" />

