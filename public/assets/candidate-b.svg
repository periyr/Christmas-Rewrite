    <rect x="0" y="0" width="84" height="12" fill="#c95937" />
    <!-- Faded Barcode / Grid Line Blocks (No Letters/Numbers) -->
    <rect x="10" y="22" width="4" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="17" y="22" width="8" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="28" y="22" width="3" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="34" y="22" width="6" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="43" y="22" width="2" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="48" y="22" width="9" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="60" y="22" width="4" height="20" fill="#291e1a" opacity="0.7" />
    <rect x="67" y="22" width="7" height="20" fill="#291e1a" opacity="0.7" />
    <!-- Dog-eared Peeled Sticker Corner -->
    <path d="M84 40 L72 52 H84 Z" fill="#291e1a" opacity="0.2" />
