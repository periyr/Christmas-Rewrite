  <path d="M134 154 Q150 162 166 154" fill="none" stroke="#d4d3d1" stroke-width="2" stroke-linecap="round" />
  <path d="M142 168 Q150 174 158 168" fill="none" stroke="#d4d3d1" stroke-width="2" stroke-linecap="round" />

  <!-- Wing Feather Cut-out Slots -->
