<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">

  <!-- Holding Rod -->
  <rect x="150" y="150" width="6" height="150" rx="1" fill="#291e1a" />
  <circle cx="153" cy="160" r="4" fill="#291e1a" />

  <!-- Perched Wooden Branch Silhouette Base -->
