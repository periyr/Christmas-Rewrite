    <path d="M156 202 L155 210 M162 202 L162 211 M168 202 L170 210" stroke="#291e1a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Cut-out Detail Holes (Paper Theatre Light Apertures) -->
