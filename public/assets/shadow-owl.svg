  <circle cx="132" cy="104" r="11" fill="#d4d3d1" />
  <circle cx="132" cy="104" r="5" fill="#291e1a" />

  <circle cx="168" cy="104" r="11" fill="#d4d3d1" />
  <circle cx="168" cy="104" r="5" fill="#291e1a" />

