<div id="app"></div>
<script>
  // Renders SVG for Elm, which can't create SVG elements without the elm/svg package.
  // The markup attribute only ever holds strings written in src/Components/Art.elm.
  customElements.define("svg-art", class extends HTMLElement {
    static observedAttributes = ["markup"];
    attributeChangedCallback(_name, _old, markup) { this.innerHTML = markup; }
  });
</script>
<script src="audio.js"></script>
<script src="elm.js"></script>
<script>
  // Saved progress (Save.elm): read once at startup, written by the saveGame port.
  // Storage can be missing or blocked (private windows, some file:// pages), so
  // every access is guarded and the game simply starts without a save.
  const SAVE_KEY = "one-more-christmas-save";
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (_) {}
  const seed = crypto.getRandomValues(new Int32Array(1))[0];
  const app = Elm.Main.init({ node: document.getElementById("app"), flags: { saved, seed } });
  if (app.ports && app.ports.playSound) {
    app.ports.playSound.subscribe((name) => window.GameAudio && window.GameAudio.play(name));
  }
  if (app.ports && app.ports.saveGame) {
    app.ports.saveGame.subscribe((data) => {
      try {
        if (data === null) localStorage.removeItem(SAVE_KEY);
        else localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (_) {}
    });
  }
</script>
