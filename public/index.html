<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One More Christmas</title>
<link rel="stylesheet" href="styles.css">
<link rel="preload" as="image" href="assets/room-present.jpg">
<link rel="preload" as="image" href="assets/room-1950.jpg">
</head>
<body>
<!-- Shared artwork. Elm draws it through <svg-art> below. The room pictures are
     in assets/; room-overlays adds what changes inside a room, switched by the
     CSS tokens under [data-era]. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="room-overlays" viewBox="0 0 1280 720">
    <g class="r-stain" stroke="#291e1a" stroke-width="1.5">
      <path fill="#8c7c56" d="M528 49c-6-14 14-20 34-18 12-14 44-18 62-9 22-11 62-9 76 3 18-3 42 3 42 14 0 6-2 9-4 10-40 2-170 3-210 0Z"/>
      <path fill="#6f6143" stroke="none" d="M580 46c-4-8 12-13 26-10 14-9 44-9 56-2 14-3 34 1 34 7 0 2-1 4-2 5-34 2-92 2-114 0Z"/>
    </g>
    <g class="r-rubble" stroke="#291e1a" stroke-width="2" stroke-linejoin="round">
      <path fill="#6f6252" d="M744 618l26-46 30 20 24-32 38 34 30-22 40 46Z"/>
      <path fill="#8a7c68" d="M806 618l16-27 25 14 20-18 29 31Z"/>
      <path fill="#7a5233" d="M766 590l86-16 2 10-86 16Z"/>
      <path fill="#a4946b" d="M866 600l18-5 5 14-18 5Z"/>
    </g>
    <g class="r-hands" fill="none" stroke="#291e1a" stroke-linecap="round">
      <path class="r-hand-hour" stroke-width="5" d="M1141 136V104"/>
      <path class="r-hand-minute" stroke-width="3.5" d="M1141 136V90"/>
    </g>
  </symbol>

  <symbol id="i-roof" viewBox="0 0 24 24"><path d="M3 12 12 4l9 8M6 10v10h12V10M10 20v-5h4v5"/></symbol>
  <symbol id="i-rubble" viewBox="0 0 24 24"><path d="M3 20l4-8 4 3 3-5 7 10ZM8 7l2-3M15 6l2 1"/></symbol>
  <symbol id="i-shelves" viewBox="0 0 24 24"><path d="M5 3v18M19 3v18M5 8h14M5 14h14M5 20h14"/></symbol>
  <symbol id="i-books" viewBox="0 0 24 24"><path d="M5 4h4v16H5ZM10 7h4v13h-4ZM15.5 6l3.5-1 3 14-3.5 1Z"/></symbol>
  <symbol id="i-glass" viewBox="0 0 24 24"><path d="M5 3h14v18H5ZM12 3v18M5 12h14M8 9l2-2M15 17l2-2"/></symbol>
  <symbol id="i-sign" viewBox="0 0 24 24"><path d="M3 6h18v9H3ZM7 15v6M17 15v6M7 10h10"/></symbol>
  <symbol id="i-boards" viewBox="0 0 24 24"><path d="M5 3h14v18H5ZM3 8l18-2M3 13l18 1M3 19l18-3"/></symbol>
</svg>
<div id="app"></div>
<script>
  // Renders SVG for Elm, which can't create SVG elements without the elm/svg package.
  // The markup attribute only ever holds strings written in src/Components/Art.elm.
  customElements.define("svg-art", class extends HTMLElement {
    static observedAttributes = ["markup"];
    attributeChangedCallback(_name, _old, markup) { this.innerHTML = markup; }
  });
</script>
<script src="elm.js"></script>
<script>Elm.Main.init({ node: document.getElementById("app") });</script>
</body>
</html>
