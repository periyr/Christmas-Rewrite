# Tests and builds the game on every push to main and on every pull request.
# A push to main also publishes the release build to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push replaces a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Elm's downloaded packages, so later runs don't fetch them again.
      - uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}

      - name: Install
        run: npm ci

      # Elm downloads its packages from GitHub the first time it compiles, and
      # a slow or failed download stops the build. Compiling the game and the
      # tests up to three times fetches everything before the real steps run.
      - name: Download Elm packages
        run: |
          for attempt in 1 2 3; do
            if npx elm make src/Main.elm --output=/dev/null && npx elm-test make; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20 seconds."
            sleep 20
          done
          exit 1

      - name: Test
        run: npm test

      # Optimised build into release/christmas-rewrite/. The script also checks
      # that every asset exists and every path is relative.
      - name: Release build
        run: npm run release

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/christmas-rewrite

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
